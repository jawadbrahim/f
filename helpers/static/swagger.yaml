openapi: 3.0.0
info:
  title: Food Category API
  description: API for managing food categories and food items.
  version: "1.0.0"
host: localhost:5000
basePath: /
paths:
  /foods:
    post:
      summary: Create a new food item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  description: The category of the food.
                title:
                  type: string
                  description: The title of the food.
                description:
                  type: string
                  description: A description of the food.
                picture:
                  type: string
                  description: The picture of the food.
                ingredients:
                  type: string
                  description: Ingredients of the food as a comma-separated string.
              required:
                - category
                - title
                - description
                - picture
                - ingredients
      responses:
        200:
          description: Food item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  category:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  picture:
                    type: string
                  ingredients:
                    type: string

  /food/{food_id}:
    parameters:
      - name: food_id
        in: path
        required: true
        description: The ID of the food item.
        schema:
          type: integer
    get:
      summary: Get a food item by its ID
      responses:
        200:
          description: Food item found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  category:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  picture:
                    type: string
                  ingredients:
                    type: string
    put:
      summary: Update an existing food item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                title:
                  type: string
                description:
                  type: string
                picture:
                  type: string
                ingredients:
                  type: string
            required:
              - category
              - title
              - description
              - picture
              - ingredients
      responses:
        200:
          description: Food item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  category:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  picture:
                    type: string
                  ingredients:
                    type: string
    delete:
      summary: Delete a food item
      responses:
        200:
          description: Food item deleted successfully

  /foods/search/{title}:
    parameters:
      - name: title
        in: path
        required: true
        description: The title of the food to search.
        schema:
          type: string
    get:
      summary: Search for a food item by title
      responses:
        200:
          description: Food items found based on search title
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    category:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    picture:
                      type: string
                    ingredients:
                      type: string

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: api-key 
      x-default: "jawad"  

security:
  - api_key: [] 